# Development overlay for the self-host stack.
#
# The production compose keeps Postgres unpublished and the compiler on an
# internal-only network. Local development runs tests and tooling on the host
# against the same stack, so this overlay publishes both:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     --profile analytics up -d --build
#
# Host ports come from `.env` (see `.env.example`); every default matches what
# the integration suites assume.
services:
  postgres:
    ports:
      - "${DATABASE_HOST_PORT:-5432}:5432"

  compiler:
    # The internal-only network blocks host port publishing, so the compiler
    # also joins the default network in development.
    networks:
      - compiler
      - default
    ports:
      - "${COMPILER_HOST_PORT:-5002}:5002"
