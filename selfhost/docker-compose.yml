name: voidhash-selfhost

x-entry-image: &entry-image
  image: ${VOIDHASH_SELFHOST_IMAGE:-voidhash-selfhost-entry:local}
  build:
    context: ..
    dockerfile: selfhost/entry/Dockerfile

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-voidhash}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-voidhash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:a4e8cf46e526a06f4f52d22f7fa8d07472b55d3c896d7ca3f159e249be38ae62
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-voidhash}
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USERNAME:-voidhash_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-voidhash}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_PUBLIC_BUCKET}"
        mc mb --ignore-existing "local/$${S3_ARTIFACT_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-voidhash}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-password}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-voidhash-public}
      S3_ARTIFACT_BUCKET: ${S3_ARTIFACT_BUCKET:-voidhash-artifacts}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *entry-image
    command: ["./node_modules/.bin/tsx", "src/migrate.ts"]
    environment: &database-environment
      SELFHOST_MODE: ${SELFHOST_MODE:-local-evaluation}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-voidhash}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-voidhash}
      DATABASE_SSL: "false"
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-voidhash}
      CLICKHOUSE_ADMIN_USERNAME: ${CLICKHOUSE_ADMIN_USERNAME:-voidhash_admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-password}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-voidhash_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
      CLICKHOUSE_RO_USERNAME: ${CLICKHOUSE_RO_USERNAME:-voidhash_ro}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-password}
      CLICKHOUSE_ANALYTICS_QUERY_USERNAME: ${CLICKHOUSE_ANALYTICS_QUERY_USERNAME:-voidhash_query}
      CLICKHOUSE_ANALYTICS_QUERY_PASSWORD: ${CLICKHOUSE_ANALYTICS_QUERY_PASSWORD:-password}
      ROOT_USERNAME: ${MIMIC_ROOT_USERNAME:-root}
      ROOT_PASSWORD: ${MIMIC_ROOT_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  compiler:
    <<: *entry-image
    command: ["./node_modules/.bin/tsx", "src/compiler/main.ts"]
    cap_drop:
      - ALL
    environment:
      COMPILER_HOST: 0.0.0.0
      COMPILER_PORT: 5002
    networks:
      - compiler
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "5002"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    <<: *entry-image
    environment:
      <<: *database-environment
      PORT: 5001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5001}
      PUBLIC_FILES_BASE_URL: ${PUBLIC_FILES_BASE_URL:-http://localhost:5001}
      MIMIC_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5001}
      MIMIC_DOCUMENT_IDLE_NOTIFY_DEBOUNCE_MS: ${MIMIC_DOCUMENT_IDLE_NOTIFY_DEBOUNCE_MS:-15000}
      CORS_ORIGINS: ${MIMIC_CORS_ORIGINS:-http://localhost:3000,http://localhost:3003}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-voidhash}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-password}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-voidhash-public}
      S3_ARTIFACT_BUCKET: ${S3_ARTIFACT_BUCKET:-voidhash-artifacts}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-sk_test_selfhost_not_configured}
      WORKOS_AUTHKIT_DOMAIN: ${WORKOS_AUTHKIT_DOMAIN:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-client_selfhost_not_configured}
      WORKOS_COOKIE_NAME: ${WORKOS_COOKIE_NAME:-wos-session}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-selfhost-development-cookie-password-change-me}
      WORKOS_REDIRECT_URI: ${WORKOS_REDIRECT_URI:-http://localhost:5001/api/auth/callback}
      WORKOS_WEBHOOK_SECRET: ${WORKOS_WEBHOOK_SECRET:-whsec_selfhost_not_configured}
      GOOGLE_PUBSUB_PUSH_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_AUDIENCE:-}
      GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT_EMAIL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APNS_DELIVERY_ENABLED: ${APNS_DELIVERY_ENABLED:-false}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      COMPONENT_COMPILER_URL: http://compiler:5002
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@voidhash.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Voidhash}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_VERIFY_ON_START: ${SMTP_VERIFY_ON_START:-true}
    ports:
      - "${MIMIC_PORT:-5001}:5001"
    networks:
      - default
      - compiler
    depends_on:
      migrate:
        condition: service_completed_successfully
      compiler:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  clickhouse_data:
  clickhouse_logs:
  mailpit_data:
  minio_data:
  postgres_data:

networks:
  compiler:
    internal: true
