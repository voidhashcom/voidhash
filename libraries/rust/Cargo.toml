[package]
name = "voidhash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for the Voidhash API"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
progenitor-client = "0.14"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[build-dependencies]
prettyplease = "0.2"
progenitor = "0.14"
openapiv3 = "2"
serde_json = "1"
syn = "2"
