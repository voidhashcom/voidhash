[package]
name = "voidhash"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official Rust SDK for the Voidhash API"

[features]
default = []
# Serve `provider::ProviderHandler` from an axum router.
axum = ["dep:axum"]

[dependencies]
axum = { version = "0.8", optional = true, default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
http = "1"
hmac = "0.12"
sha2 = "0.10"
progenitor-client = "0.14"
regress = "0.11"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Shares the one session lookup that resolves the client's project.
tokio = { version = "1", default-features = false, features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[build-dependencies]
prettyplease = "0.2"
progenitor = "0.14"
openapiv3 = "2"
serde_json = "1"
syn = "2"
