buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.9.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/NitroVoidhash+autolinking.gradle'

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroVoidhash_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroVoidhash_" + name]).toInteger()
}

// The shared Kotlin core (`@voidhash/android`) is compiled straight into this module instead of
// being a separate gradle project, so consumer apps keep a single library to build. Node resolution
// works for published/installed consumers; the relative fallback covers the in-repo checkout, where
// the package may not be linked into node_modules yet.
def voidhashCoreSourceDir() {
  return new File(voidhashAndroidPackageDir(), "core/src/main/java").absolutePath
}

// The bare-native SDK (`sdk` module of `@voidhash/android`) is compiled in next to the core
// sources: the storage, platform and flow hybrids build on it.
def voidhashSdkSourceDir() {
  return new File(voidhashAndroidPackageDir(), "sdk/src/main/java").absolutePath
}

// The native flow renderer (`ui` module of `@voidhash/android`) is compiled in only when the app
// opts in with `Voidhash_renderer=true` in its gradle.properties, which the config plugin's
// `renderer` option writes. It carries a native library per ABI, so apps without flows skip it.
def voidhashRendererEnabled() {
  return rootProject.findProperty("Voidhash_renderer") == "true"
}

def voidhashRendererDir() {
  return new File(voidhashAndroidPackageDir(), "ui/src/main")
}

def voidhashAndroidPackageDir() {
  def rnPackageDir = projectDir.parentFile

  try {
    def script = "console.log(require('node:path').dirname(require.resolve('@voidhash/android/package.json', { paths: [process.argv[1]] })))"
    def process = new ProcessBuilder("node", "-e", script, rnPackageDir.absolutePath)
      .directory(rnPackageDir)
      .redirectError(ProcessBuilder.Redirect.DISCARD)
      .start()
    def resolved = process.inputStream.text.trim()
    process.waitFor()

    if (process.exitValue() == 0 && !resolved.isEmpty()) {
      return resolved
    }
  } catch (Exception ignored) {
    // fall through to the physical sibling path below
  }

  return new File(rnPackageDir, "../android").absolutePath
}

android {
  namespace "com.margelo.nitro.voidhash"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    consumerProguardFiles "consumer-rules.pro"
    if (voidhashRendererEnabled()) {
      consumerProguardFiles new File(voidhashAndroidPackageDir(), "ui/consumer-rules.pro").absolutePath
    }

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [voidhashCoreSourceDir(), voidhashSdkSourceDir()]

      if (voidhashRendererEnabled()) {
        java.srcDirs += [new File(voidhashRendererDir(), "java").absolutePath]
        jniLibs.srcDirs += [new File(voidhashRendererDir(), "jniLibs").absolutePath]
      }

      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
  implementation 'com.android.billingclient:billing:9.1.0'
  implementation 'com.android.installreferrer:installreferrer:2.2'
  implementation 'com.google.android.gms:play-services-base:18.7.2'
  // Dependencies of the bare-native SDK sources compiled into this module.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'androidx.annotation:annotation:1.8.0'
  // The shared SDK sources reach AndroidX Fragment and Navigation reflectively
  // and through optional helpers; they must be on the compile classpath here
  // exactly as in the bare SDK module, without becoming runtime dependencies.
  compileOnly 'androidx.fragment:fragment:1.1.0'
  compileOnly 'androidx.navigation:navigation-runtime:2.8.9'
}
