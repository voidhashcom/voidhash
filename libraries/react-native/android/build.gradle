buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.9.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/NitroVoidhash+autolinking.gradle'

// No `com.facebook.react` plugin: for a library it only runs React Native codegen, and this
// module's native interface comes from Nitro (`nitrogen/`), not codegen. Codegen would scan the
// package folder, including any node_modules the package manager nests inside it, and compile
// other packages' specs into this library: copies of React Native's core modules, which replace
// the app's own classes at runtime, or of view managers such as react-native-screens', which fail
// the app's dex merge as duplicates. The app's own plugin still configures this module's
// React Native dependency, build config and namespace.

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroVoidhash_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroVoidhash_" + name]).toInteger()
}

// An artifact of the Android SDK this bridge runs on: from Maven Central at this package's own
// version, since the React Native, iOS and Android SDKs are released together under one version.
// An app that builds the SDK from source (the config plugin's `nativeSdk` option) has its modules
// as projects named after the artifacts, and gets those instead.
def voidhashSdk(artifact) {
  def sourceProject = rootProject.findProject(":${artifact}")
  if (sourceProject != null) {
    return sourceProject
  }
  // A preview build (pkg.voidha.sh) names the released version it runs on.
  def manifest = new groovy.json.JsonSlurper().parse(new File(projectDir.parentFile, "package.json"))
  def version = manifest.voidhash?.nativeSdkVersion ?: manifest.version
  return "com.voidhash:${artifact}:${version}"
}

// The flow renderer (`com.voidhash:voidhash-ui`), which `presentFlow()` needs, is added only when
// the app opts in with `Voidhash_renderer=true` in its gradle.properties, which the config
// plugin's `renderer` option writes. It carries a native library per ABI, so apps without flows
// skip it. The SDK finds it on its own once it is on the classpath.
def voidhashRendererEnabled() {
  return rootProject.findProperty("Voidhash_renderer") == "true"
}

android {
  namespace "com.margelo.nitro.voidhash"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    consumerProguardFiles "consumer-rules.pro"

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
  // `api`, as when the SDK's sources were compiled into this module: the app's own code and its
  // local modules can use the SDK and the renderer directly. The SDK brings Google Play Billing.
  api voidhashSdk("voidhash")
  if (voidhashRendererEnabled()) {
    api voidhashSdk("voidhash-ui")
  }
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'androidx.annotation:annotation:1.8.0'
}
