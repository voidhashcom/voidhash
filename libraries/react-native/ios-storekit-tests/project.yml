name: VoidhashStoreKitTests
options:
  bundleIdPrefix: com.voidhash.tests
  deploymentTarget:
    iOS: "17.0"
  schemePathPrefix: ../../../
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  StoreKitTestHost:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Voidhash StoreKit Tests
        UILaunchScreen: {}
  StoreKitPurchaseTests:
    type: bundle.unit-test
    platform: iOS
    info:
      path: Tests/Info.plist
    sources:
      - Tests
      - path: ../../ios/Sources/VoidhashCore/StoreKit/TransactionRetentionStore.swift
      - path: Resources/PurchaseValidation.storekit
        buildPhase: resources
    dependencies:
      - target: StoreKitTestHost
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StoreKitTestHost.app/StoreKitTestHost
schemes:
  StoreKitPurchaseTests:
    build:
      targets:
        StoreKitTestHost: all
        StoreKitPurchaseTests: [test]
    test:
      targets:
        - StoreKitPurchaseTests
    run:
      config: Debug
      storeKitConfiguration: Resources/PurchaseValidation.storekit
