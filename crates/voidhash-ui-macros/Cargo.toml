# Released with voidhash-ui, at its version; see its manifest.
[package]
name = "voidhash-ui-macros"
version = "0.1.0"
description = "Procedural macros of voidhash-ui. Depend on voidhash-ui, which re-exports them."
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/voidhashcom/voidhash"
homepage = "https://voidhash.com/docs/components"
documentation = "https://docs.rs/voidhash-ui"
readme = "README.md"
keywords = ["voidhash", "paywall", "webassembly", "proc-macro"]
categories = ["wasm", "development-tools::procedural-macro-helpers"]
include = ["/Cargo.toml", "/src/**", "/README.md", "/LICENSE.md", "/CHANGELOG.md"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
