peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Kept false as a conservative default: `catalog:`/version-range deps resolve from the registry
# rather than being shadowed by a same-named workspace package. The original driver — the in-repo
# mimic packages colliding with the previously published @voidhash/mimic (since dropped
# entirely) — no longer applies now that internal dependencies use `workspace:*`. All internal
# deps use the `workspace:*` protocol, which links regardless of this flag, so true/false are
# equivalent for the current dependency graph.
linkWorkspacePackages: false
nodeLinker: hoisted
# The private cloud workspace consumes this repository as a nested workspace.
# Its root install is authoritative there; package scripts must not start a second
# install from this nested workspace while Turbo is running the combined graph.
verifyDepsBeforeRun: false
minimumReleaseAge: 0
blockExoticSubdeps: false
allowBuilds:
  "@confluentinc/kafka-javascript": false
  "@mongodb-js/zstd": false
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  node-liblzma: false
  nitro-codegen: true
  protobufjs: true
  react-native-nitro-modules: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true
  vue-demi: true
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
