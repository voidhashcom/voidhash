name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/voidhashcom/voidhash/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md
          remote-organization-name: voidhashcom
          remote-repository-name: cla-signatures
          branch: main
          allowlist: voidhash-bot,dependabot[bot]
