name: Repository CI

on:
  push:
    branches: [main, preview]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Check publication boundary
        run: node scripts/check-publication-boundary.mjs

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turborepo cache
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm install --frozen-lockfile

      - name: Build
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm build --concurrency=2

      - name: Typecheck
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm typecheck --concurrency=2

      - name: Test
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm test --concurrency=2
