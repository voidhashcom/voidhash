name: Repository CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - docs/**
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes cancel their stale runs; main never cancels, so every
# main commit keeps a complete CI verdict.
concurrency:
  group: repository-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keeps turbo within the runner's 4 vCPUs; the scripts stay flag-free so the
  # local and CI invocations are the same command.
  TURBO_CONCURRENCY: 2

# Two parallel lanes instead of one serial job: the purchase/restore contract
# chain (React Native specs plus an Android gradle compile) no longer blocks
# the verify tier. Both lanes belong to this one workflow, so anything keyed
# off the overall Repository CI conclusion is unaffected.
jobs:
  verify:
    name: Verify (checks, lint, typecheck, unit tier)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --concurrency=2

      # The same command developers run locally; it already includes the
      # publication-boundary, platform-seam and test-tier checks. The
      # stack-backed tiers (`test:integration`, `test:e2e`) run in the Selfhost
      # Stack workflow, which owns the Compose lifecycle; together they cover
      # `pnpm verify`.
      - name: Verify (lint + typecheck + unit tier)
        run: pnpm verify:quick

  purchase-restore:
    name: Purchase and restore contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate purchase and restore contracts
        run: pnpm test:purchase-restore
