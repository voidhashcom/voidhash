name: Publish SDK Canaries (Preview)

on:
  push:
    branches:
      - preview
    paths:
      - libraries/**
      - packages/api-spec/**
      - packages/shared/**
      - packages/tsconfig/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/publish-libraries-canary-preview.yml

permissions:
  contents: read

concurrency: library-canaries-preview-${{ github.ref }}

jobs:
  publish-canary:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare coordinated canary versions
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          SHORT_SHA="$short_sha" node <<'EOF'
          const fs = require("node:fs");

          const canarySuffix = `canary.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}.${process.env.SHORT_SHA}`;
          const packages = [
            { path: "./packages/api-spec/package.json", indent: 2 },
            { path: "./libraries/node/package.json", indent: 2, apiSpecField: "dependencies" },
            { path: "./libraries/web/package.json", indent: 2, apiSpecField: "dependencies" },
            { path: "./libraries/react-native/package.json", indent: "\t", apiSpecField: "devDependencies" },
          ];

          const apiSpecPath = "./packages/api-spec/package.json";
          const apiSpec = JSON.parse(fs.readFileSync(apiSpecPath, "utf8"));
          const canaryVersion = `${apiSpec.version}-${canarySuffix}`;
          apiSpec.version = canaryVersion;
          fs.writeFileSync(apiSpecPath, JSON.stringify(apiSpec, null, 2) + "\n");

          for (const pkg of packages.slice(1)) {
            const manifest = JSON.parse(fs.readFileSync(pkg.path, "utf8"));
            manifest.version = canaryVersion;
            if (pkg.apiSpecField) {
              manifest[pkg.apiSpecField]["@voidhash/api-spec"] = canaryVersion;
            }
            fs.writeFileSync(pkg.path, JSON.stringify(manifest, null, pkg.indent) + "\n");
          }

          process.stdout.write(canaryVersion);
          EOF

      - name: Typecheck api-spec
        run: pnpm --filter @voidhash/api-spec typecheck

      - name: Typecheck node
        run: pnpm --filter @voidhash/node typecheck

      - name: Typecheck web
        run: pnpm --filter @voidhash/web typecheck

      - name: Typecheck react-native
        run: pnpm --filter @voidhash/react-native typecheck

      - name: Build node
        run: pnpm --filter @voidhash/node build

      - name: Build web
        run: pnpm --filter @voidhash/web build

      - name: Build react-native
        run: pnpm --filter @voidhash/react-native build

      - name: Publish api-spec canary
        working-directory: packages/api-spec
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --access public

      - name: Publish node canary
        working-directory: libraries/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --access public

      - name: Publish web canary
        working-directory: libraries/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --access public

      - name: Publish react-native canary
        working-directory: libraries/react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --access public
