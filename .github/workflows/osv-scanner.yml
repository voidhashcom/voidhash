name: OSV Scanner

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**/package.json
      - examples/**/package.json
      - libraries/**/package.json
      - packages/**/package.json
      - selfhost/**/package.json
      - .github/workflows/osv-scanner.yml
  push:
    branches: [main, preview]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**/package.json
      - examples/**/package.json
      - libraries/**/package.json
      - packages/**/package.json
      - selfhost/**/package.json
      - .github/workflows/osv-scanner.yml
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8

  scan-full:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: false
