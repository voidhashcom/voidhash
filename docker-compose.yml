services:
  standalone_mysql:
    image: mysql:latest
    container_name: standalone_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: voidhash
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - standalone_mysql_data:/var/lib/mysql

volumes:
  standalone_mysql_data: