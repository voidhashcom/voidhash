services:
  standalone_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voidhash
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voidhash
    ports:
      - "5432:5432"
    volumes:
      - standalone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidhash -d voidhash"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  standalone_postgres_data:
